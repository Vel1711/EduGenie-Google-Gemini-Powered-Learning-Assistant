<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <p class="eyebrow">GENERATIVE AI LEARNING ASSISTANT</p>
        <h1>EduGenie</h1>
        <p class="subtitle">Ask, understand, practice, summarize and learn with AI.</p>
      </div>
      <div id="status" class="status">Checking API…</div>
    </header>

    <section class="card">
      <label for="task">Choose a task</label>
      <select id="task">
        <option value="qa">Ask a Question</option>
        <option value="explain">Explain a Topic</option>
        <option value="quiz">Generate Quiz</option>
        <option value="summarize">Summarize</option>
        <option value="learn">Recommend Learning Path</option>
      </select>

      <label for="inputText">Your input</label>
      <textarea id="inputText" rows="10"
        placeholder="Example: Explain the Pythagoras theorem in simple terms."></textarea>

      <button id="submitBtn">Generate Answer</button>
      <p id="error" class="error hidden"></p>
    </section>

    <section id="result" class="card result hidden">
      <h2>Result</h2>
      <div id="resultContent"></div>
    </section>
  </main>

  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
